version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: netguard_e2e_postgres
    environment:
      POSTGRES_DB: netguard_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d netguard_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d/migrations:ro
    command: postgres -c log_statement=all -c log_duration=on

volumes:
  postgres_data:
