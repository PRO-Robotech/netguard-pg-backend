apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: netguard-debug

# Build configuration
build:
  tagPolicy:
    dateTime:
      format: "2006-01-02_15-04-05.999_MST"
      timezone: "UTC"

  local:
    push: false  # Don't push to registry, load directly to minikube

  artifacts:
    - image: netguard/pg-backend
      context: ../..
      docker:
        dockerfile: .deploy/dockerfiles/Dockerfile.backend.debug
        buildArgs:
          TARGETOS: linux
          TARGETARCH: amd64

    - image: netguard/k8s-apiserver
      context: ../..
      docker:
        dockerfile: .deploy/dockerfiles/Dockerfile.apiserver.debug
        buildArgs:
          TARGETOS: linux
          TARGETARCH: amd64

    - image: netguard/webhook
      context: ../..
      docker:
        dockerfile: .deploy/dockerfiles/Dockerfile.webhook.debug
        buildArgs:
          TARGETOS: linux
          TARGETARCH: amd64

    - image: netguard/goose
      context: ../..
      docker:
        dockerfile: .deploy/dockerfiles/Dockerfile.goose.debug

# Deploy configuration
deploy:
  kubectl:
    defaultNamespace: incloud-sgroups
    manifests:
      - ../k8s/*.yaml
  statusCheckDeadlineSeconds: 300
  logs:
    prefix: none

# Port forwarding for local development
portForward:
  - resourceType: deployment
    resourceName: netguard-backend-debug
    port: 2345
    localPort: 2345

  - resourceType: deployment
    resourceName: netguard-apiserver-debug
    port: 2346
    localPort: 2346

  - resourceType: deployment
    resourceName: netguard-webhook-debug
    port: 2347
    localPort: 2347

  - resourceType: service
    resourceName: postgresql
    port: 5432
    localPort: 5432

# Profiles for different debug scenarios
profiles:
  # Profile: Debug all services (full debug chain)
  - name: debug-all
    build:
      artifacts:
        - image: netguard/pg-backend
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.backend.debug
        - image: netguard/k8s-apiserver
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.apiserver.debug
        - image: netguard/webhook
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.webhook.debug
        - image: netguard/goose
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.goose.debug
    deploy:
      kubectl:
        manifests:
          - ../k8s/apiserver-environment-debug.yaml
          - ../k8s/backend-debug.yaml
          - ../k8s/apiserver-debug.yaml
          - ../k8s/webhook-debug.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 2345
        localPort: 2345
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 8080
        localPort: 8080
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 9090
        localPort: 9090
      - resourceType: deployment
        resourceName: netguard-apiserver-debug
        namespace: incloud-sgroups
        port: 2346
        localPort: 2346
      - resourceType: deployment
        resourceName: netguard-webhook-debug
        namespace: incloud-sgroups
        port: 2347
        localPort: 2347
      - resourceType: service
        resourceName: netguard-postgresql
        namespace: incloud-sgroups
        port: 5432
        localPort: 5432

  # Profile: Debug backend only (most common)
  - name: debug-backend
    build:
      artifacts:
        - image: netguard/pg-backend
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.backend.debug
        - image: netguard/goose
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.goose.debug
    deploy:
      kubectl:
        manifests:
          - ../k8s/backend-debug.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-backend-debug
        port: 2345
        localPort: 2345
      - resourceType: service
        resourceName: postgresql
        port: 5432
        localPort: 5432

  # Profile: Debug apiserver only
  - name: debug-apiserver
    build:
      artifacts:
        - image: netguard/k8s-apiserver
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.apiserver.debug
    deploy:
      kubectl:
        manifests:
          - ../k8s/apiserver-debug.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-apiserver-debug
        port: 2346
        localPort: 2346

  # Profile: Debug webhook only
  - name: debug-webhook
    build:
      artifacts:
        - image: netguard/webhook
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.webhook.debug
    deploy:
      kubectl:
        manifests:
          - ../k8s/webhook-debug.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-webhook-debug
        port: 2347
        localPort: 2347

  # Profile: Hot reload backend (Air + file sync)
  # Perfect for rapid development - changes apply in 2-5 seconds
  - name: debug-hot-reload
    build:
      artifacts:
        - image: netguard/pg-backend
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.backend.debug-air
            buildArgs:
              TARGETOS: linux
              TARGETARCH: amd64
          sync:
            auto: true
        - image: netguard/goose
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.goose.debug
    deploy:
      kubectl:
        defaultNamespace: incloud-sgroups
        manifests:
          - ../k8s/backend-hot-reload.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 2345
        localPort: 2345
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 9090
        localPort: 9090
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 8080
        localPort: 8080
      - resourceType: service
        resourceName: netguard-postgresql
        namespace: incloud-sgroups
        port: 5432
        localPort: 5432

  # Profile: Hot reload ALL services (Backend + APIServer + Webhook)
  # Perfect for full-stack development with hot reload + debug
  # Changes apply in 2-5 seconds across all services
  - name: hot-reload-all
    build:
      artifacts:
        - image: netguard/pg-backend
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.backend.debug-air
            buildArgs:
              TARGETOS: linux
              TARGETARCH: amd64
          sync:
            manual:
              - src: "internal/**/*.go"
                dest: /src/internal
                strip: internal
              - src: "cmd/**/*.go"
                dest: /src/cmd
                strip: cmd
              - src: "pkg/**/*.go"
                dest: /src/pkg
                strip: pkg
        - image: netguard/k8s-apiserver
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.apiserver.debug-air
            buildArgs:
              TARGETOS: linux
              TARGETARCH: amd64
          sync:
            manual:
              - src: "internal/**/*.go"
                dest: /src/internal
                strip: internal
              - src: "cmd/**/*.go"
                dest: /src/cmd
                strip: cmd
              - src: "pkg/**/*.go"
                dest: /src/pkg
                strip: pkg
        - image: netguard/webhook
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.webhook.debug-air
            buildArgs:
              TARGETOS: linux
              TARGETARCH: amd64
          sync:
            manual:
              - src: "internal/**/*.go"
                dest: /src/internal
                strip: internal
              - src: "cmd/**/*.go"
                dest: /src/cmd
                strip: cmd
              - src: "pkg/**/*.go"
                dest: /src/pkg
                strip: pkg
        - image: netguard/goose
          context: ../..
          docker:
            dockerfile: .deploy/dockerfiles/Dockerfile.goose.debug
    deploy:
      kubectl:
        defaultNamespace: incloud-sgroups
        manifests:
          - ../k8s/apiserver-environment-debug.yaml
          - ../k8s/backend-hot-reload.yaml
          - ../k8s/apiserver-hot-reload.yaml
          - ../k8s/webhook-hot-reload.yaml
    portForward:
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 2345
        localPort: 2345
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 8080
        localPort: 8080
      - resourceType: deployment
        resourceName: netguard-backend-debug
        namespace: incloud-sgroups
        port: 9090
        localPort: 9090
      - resourceType: deployment
        resourceName: netguard-apiserver-debug
        namespace: incloud-sgroups
        port: 2346
        localPort: 2346
      - resourceType: deployment
        resourceName: netguard-webhook-debug
        namespace: incloud-sgroups
        port: 2347
        localPort: 2347
      - resourceType: service
        resourceName: netguard-postgresql
        namespace: incloud-sgroups
        port: 5432
        localPort: 5432
