---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netguard-webhook-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/instance: netguard
    app.kubernetes.io/component: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: netguard-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook
        app.kubernetes.io/instance: netguard-debug
        app.kubernetes.io/component: debug
    spec:
      serviceAccountName: netguard-webhook

      containers:
      - name: webhook
        image: netguard/webhook
        imagePullPolicy: IfNotPresent

        # Override entrypoint to run with Delve
        command: ["/usr/local/bin/dlv"]
        args:
          - --listen=:2347
          - --headless=true
          - --api-version=2
          - --accept-multiclient
          - --continue
          - --log
          - --log-output=debugger,rpc
          - exec
          - /app/netguard-webhook
          - --
          - --port=9443
          - --cert-dir=/etc/certs

        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 2347
          name: debug
          protocol: TCP

        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true

        # Debug mode: minimal exec probe to avoid EOF warnings
        # Using exec with /bin/true as a simple health check
        # Application port 9443 won't be available until debugger connects
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 10

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 10
          periodSeconds: 60
          failureThreshold: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"

        securityContext:
          runAsNonRoot: false
          capabilities:
            add:
              - SYS_PTRACE

      volumes:
      - name: certs
        secret:
          secretName: netguard-certs

---
apiVersion: v1
kind: Service
metadata:
  name: netguard-webhook-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/instance: netguard-debug
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/instance: netguard-debug
  ports:
  - name: webhook
    port: 443
    targetPort: 9443
    protocol: TCP
  - name: debug
    port: 2347
    targetPort: 2347
    protocol: TCP
