---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netguard-apiserver-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard
    app.kubernetes.io/component: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apiserver
      app.kubernetes.io/instance: netguard-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiserver
        app.kubernetes.io/instance: netguard-debug
        app.kubernetes.io/component: debug
    spec:
      serviceAccountName: netguard-apiserver

      containers:
      - name: apiserver
        image: netguard/k8s-apiserver:2025-10-07_14-28-21.956_UTC
        imagePullPolicy: IfNotPresent

        # Override entrypoint to run with Delve
        command: ["/usr/local/bin/dlv"]
        args:
          - --listen=:2346
          - --headless=true
          - --api-version=2
          - --accept-multiclient
          - --continue
          - --log
          - --log-output=debugger,rpc
          - exec
          - /app/netguard-apiserver
          - --
          - --secure-port=8443
          - --bind-address=0.0.0.0
          - --tls-cert-file=/etc/certs/tls.crt
          - --tls-private-key-file=/etc/certs/tls.key
          - --v=2

        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 2346
          name: debug
          protocol: TCP

        envFrom:
        - configMapRef:
            name: netguard-environment-debug

        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true

        # Debug mode: minimal exec probe to avoid EOF warnings
        # Using exec with /bin/true as a simple health check
        # Application port 8443 won't be available until debugger connects
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 10

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 10
          periodSeconds: 60
          failureThreshold: 10

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        securityContext:
          runAsNonRoot: false
          capabilities:
            add:
              - SYS_PTRACE

      volumes:
      - name: certs
        secret:
          secretName: netguard-certs

---
apiVersion: v1
kind: Service
metadata:
  name: netguard-apiserver-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard-debug
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard-debug
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: debug
    port: 2346
    targetPort: 2346
    protocol: TCP
