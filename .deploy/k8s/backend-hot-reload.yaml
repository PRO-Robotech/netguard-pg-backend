---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netguard-backend-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: netguard
    app.kubernetes.io/component: debug-hot-reload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: netguard-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: netguard-debug
        app.kubernetes.io/component: debug-hot-reload
    spec:
      # Init container for migrations
      initContainers:
      - name: goose
        image: netguard/goose
        imagePullPolicy: IfNotPresent
        command:
          - /app/debug-migrate.sh
          - -dir=/app/migrations
          - -table=netguard_db_ver
          - postgres
          - $(DATABASE_CONNECTION_URL)
          - up
        envFrom:
        - configMapRef:
            name: netguard-environment
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      containers:
      - name: backend
        image: netguard/pg-backend
        imagePullPolicy: IfNotPresent

        # NO command override - use CMD from Dockerfile (air)
        # Air will handle hot reload and process management

        ports:
        - containerPort: 9090
          name: grpc
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 2345
          name: debug
          protocol: TCP

        envFrom:
        - configMapRef:
            name: netguard-environment

        volumeMounts:
        - name: config
          mountPath: /etc/netguard/config.yaml
          subPath: config

        # Hot reload mode: relaxed health checks
        # Air may restart process frequently during development
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 30
          periodSeconds: 60
          failureThreshold: 10

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 10

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Security context adjusted for debugging
        securityContext:
          runAsNonRoot: false
          capabilities:
            add:
              - SYS_PTRACE  # Required for Delve (if used)

      volumes:
      - name: config
        configMap:
          name: netguard-config

---
apiVersion: v1
kind: Service
metadata:
  name: netguard-backend-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: netguard-debug
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: netguard-debug
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: debug
    port: 2345
    targetPort: 2345
    protocol: TCP
