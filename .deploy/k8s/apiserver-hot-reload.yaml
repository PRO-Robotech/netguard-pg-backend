---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netguard-apiserver-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard
    app.kubernetes.io/component: debug-hot-reload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apiserver
      app.kubernetes.io/instance: netguard-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiserver
        app.kubernetes.io/instance: netguard-debug
        app.kubernetes.io/component: debug-hot-reload
    spec:
      serviceAccountName: netguard-apiserver

      containers:
      - name: apiserver
        image: netguard/k8s-apiserver
        imagePullPolicy: IfNotPresent

        # NO command override - use CMD from Dockerfile (air)
        # Air will handle hot reload and process management

        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 2346
          name: debug
          protocol: TCP

        envFrom:
        - configMapRef:
            name: netguard-environment-debug

        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true

        # Hot reload mode: relaxed health checks
        # Air may restart process frequently during development
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 30
          periodSeconds: 60
          failureThreshold: 10

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "exit 0"
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 10

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Security context adjusted for debugging
        securityContext:
          runAsNonRoot: false
          capabilities:
            add:
              - SYS_PTRACE  # Required for Delve

      volumes:
      - name: certs
        secret:
          secretName: netguard-certs

---
apiVersion: v1
kind: Service
metadata:
  name: netguard-apiserver-debug
  namespace: incloud-sgroups
  labels:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard-debug
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apiserver
    app.kubernetes.io/instance: netguard-debug
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: debug
    port: 2346
    targetPort: 2346
    protocol: TCP
